spring.application.name=smart-gateway-service
server.port=8080

info.app.name=Smart Gateway Service
info.app.description=Custom API gateway for routing, security, and traffic management

management.api.username=${GATEKEEPER_GATEWAY_USERNAME:gateway-service}
management.api.password=${GATEKEEPER_GATEWAY_PASSWORD:gateway123}
management.api.base-url=${GATEKEEPER_MANAGEMENT_URL:http://localhost:8081}

# Scheduled route configuration synchronization
gateway.configuration.refresh-interval-ms=${GATEKEEPER_CONFIGURATION_REFRESH_INTERVAL_MS:10000}

# Upstream safety (SSRF protection)
gateway.safety.enabled=${GATEKEEPER_SAFETY_ENABLED:true}
gateway.safety.development-mode=${GATEKEEPER_DEV_MODE:true}

# Rate limiting - trusted proxies for X-Forwarded-For
gateway.trusted-proxies=${GATEKEEPER_TRUSTED_PROXIES:}
